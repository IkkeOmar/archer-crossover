# Default sweep configuration for archer-crossover
# Used by src/sweep.py when --grid-mode default is selected.

# Delay distribution parameters
n_mu_grid:
  - 1
  - 3
  - 5
  - 8
  - 12
  - 18
  - 25
  - 35
  - 50

# Zero-delay probability
x_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0

# Bearish allocation on 1D only (sub-daily always uses 1.0)
bear_alloc_1d_grid:
  - 0.0
  - 0.5
  - 0.75
  - 1.0

# EMA pairs
ema_pairs:
  - [9, 21]
  - [12, 26]
  - [20, 50]

# Delay distribution std (multiple of n_mu); 0.5 = "moderate"
sigma_n_factor: 0.5

# Transaction cost in basis points per round-trip
cost_bps: 5.0

# Initial capital
initial_cash: 100000.0

# Random seed for reproducibility
rng_seed: 42
